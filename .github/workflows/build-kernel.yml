name: Compilar kernel de LirioOS

on:
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar un lanzamiento (release) con la ISO"
        type: boolean
        default: false
      version:
        description: "Número de versión del lanzamiento (por ejemplo 0.2.0)"
        type: string
        default: "0.2.0"
  push:
    branches: [main]
    paths:
      - "kernel/**"
      - ".github/workflows/build-kernel.yml"
    tags:
      - "kernel-v*"

permissions:
  contents: write

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm gcc-multilib grub-pc-bin xorriso mtools dosfstools qemu-system-x86 imagemagick

      - name: Compilar kernel y ISO
        working-directory: kernel
        run: |
          make
          make iso

      - name: Preparar un disco FAT32 de prueba (hecho con Linux)
        working-directory: kernel
        run: |
          truncate -s 64M disco.img
          mkfs.vfat -F 32 -s 1 -n PRUEBA disco.img
          echo "Hola, este archivo lo puse desde un PC con Linux." > hola.txt
          echo "Un documento con nombre largo." > "documento con nombre largo.txt"
          mcopy -i disco.img hola.txt ::HOLA.TXT
          mcopy -i disco.img "documento con nombre largo.txt" ::
          mmd -i disco.img ::FOTOS
          echo "dentro de una carpeta" > dentro.txt
          mcopy -i disco.img dentro.txt ::FOTOS/DENTRO.TXT
          mdir -i disco.img ::

      - name: Arrancar en QEMU y sacar capturas de pantalla
        working-directory: kernel
        run: |
          (
            # doble clic: dos pulsaciones seguidas (el explorador pide menos de 0,6 s entre ellas)
            dbl() { echo "mouse_button 1"; sleep 0.1; echo "mouse_button 0"; sleep 0.1; echo "mouse_button 1"; sleep 0.1; echo "mouse_button 0"; sleep 1; }
            sleep 12
            echo "screendump /tmp/arranque.ppm"
            sleep 1
            for k in a y u d a ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 2
            echo "screendump /tmp/ayuda.ppm"
            sleep 1
            # Comandos con carpetas: cd docs, ls, cat lirio.txt, date
            for k in c d spc d o c s ret  l s ret  c a t spc l i r i o dot t x t ret  d a t e ret  u p t i m e ret  m e m ret; do
              echo "sendkey $k"; sleep 0.3
            done
            sleep 1
            echo "screendump /tmp/comandos.ppm"
            sleep 1
            # Disco: cd .. , cd disco, ls, cat hola.txt, disco
            for k in c d spc dot dot ret  c d spc d i s c o ret  l s ret  c a t spc h o l a dot t x t ret  d i s c o ret; do
              echo "sendkey $k"; sleep 0.3
            done
            sleep 1
            echo "screendump /tmp/disco.ppm"
            sleep 1
            # Teclado español: echo hola ñandú ¿qué?
            for k in e c h o spc h o l a spc semicolon a n d apostrophe u spc shift-equal q u apostrophe e shift-minus ret; do
              echo "sendkey $k"; sleep 0.3
            done
            sleep 1
            # Ratón: sube hasta la barra de título, pulsa, arrastra la ventana y suelta
            for i in 1 2 3 4 5 6; do echo "mouse_move 0 -54"; sleep 0.3; done
            sleep 1
            echo "mouse_button 1"; sleep 0.5
            for i in 1 2 3 4 5 6; do echo "mouse_move 20 17"; sleep 0.4; done
            echo "mouse_button 0"; sleep 1
            echo "screendump /tmp/raton.ppm"
            sleep 1
            # Dock: baja hasta el icono de Archivos y haz clic
            for i in 1 2 3 4 5 6; do echo "mouse_move -31 92"; sleep 0.4; done
            sleep 1
            echo "mouse_button 1"; sleep 0.5
            echo "mouse_button 0"; sleep 1
            echo "screendump /tmp/dock.ppm"
            sleep 1
            # Explorador: sube al primer elemento (la carpeta docs), entra y abre el primer archivo
            for i in 1 2 3 4 5 6; do echo "mouse_move -16 -80"; sleep 0.4; done
            sleep 1
            dbl
            echo "screendump /tmp/explorador.ppm"
            sleep 1
            dbl
            echo "screendump /tmp/visor.ppm"
            sleep 1
            # Galería: lleva el cursor a la esquina (0,0) y desde ahí a cada botón
            for i in 1 2 3 4 5 6 7 8; do echo "mouse_move -200 -200"; sleep 0.2; done
            sleep 1
            for i in 1 2; do echo "mouse_move 167 79"; sleep 0.3; done        # botón Volver (334,158)
            echo "mouse_button 1"; sleep 0.4; echo "mouse_button 0"; sleep 0.8   # Volver
            echo "mouse_button 1"; sleep 0.4; echo "mouse_button 0"; sleep 0.8   # Subir a la raíz
            echo "mouse_move 124 78"; sleep 0.5                                  # carpeta imagenes
            dbl
            echo "screendump /tmp/galeria.ppm"
            sleep 1
            echo "mouse_move -108 0"; sleep 0.5                                  # primera imagen
            dbl
            echo "screendump /tmp/imagen.ppm"
            sleep 1
            echo "mouse_move 154 -78"; sleep 0.5                                 # botón Siguiente
            echo "mouse_button 1"; sleep 0.4; echo "mouse_button 0"; sleep 1
            echo "screendump /tmp/imagen2.ppm"
            sleep 1
            # Editor: Volver, Subir a la raíz, Nuevo, escribir "hola ñandú" y Guardar
            echo "mouse_move -170 0"; sleep 0.5                                  # botón Volver
            echo "mouse_button 1"; sleep 0.4; echo "mouse_button 0"; sleep 0.8
            echo "mouse_button 1"; sleep 0.4; echo "mouse_button 0"; sleep 0.8   # Subir
            echo "mouse_move 168 0"; sleep 0.5                                   # botón Nuevo
            echo "mouse_button 1"; sleep 0.4; echo "mouse_button 0"; sleep 1
            for k in h o l a spc semicolon a n d apostrophe u; do echo "sendkey $k"; sleep 0.3; done
            echo "screendump /tmp/editor.ppm"
            sleep 1
            echo "mouse_move -168 0"; sleep 0.5                                  # botón Guardar
            echo "mouse_button 1"; sleep 0.4; echo "mouse_button 0"; sleep 1
            echo "screendump /tmp/guardado.ppm"
            sleep 1
            # Guardar en el disco: Volver, entrar en la carpeta disco (4.ª), Nuevo, escribir y Guardar
            echo "mouse_button 1"; sleep 0.4; echo "mouse_button 0"; sleep 0.8   # Volver
            echo "mouse_move 340 78"; sleep 0.5                                  # carpeta disco
            dbl
            echo "mouse_move -172 -78"; sleep 0.5                                # botón Nuevo
            echo "mouse_button 1"; sleep 0.4; echo "mouse_button 0"; sleep 1
            for k in d i s c o spc o k; do echo "sendkey $k"; sleep 0.3; done
            echo "mouse_move -168 0"; sleep 0.5                                  # botón Guardar
            echo "mouse_button 1"; sleep 0.4; echo "mouse_button 0"; sleep 1
            echo "screendump /tmp/disco_gui.ppm"
            sleep 1
            echo "quit"
          ) | qemu-system-i386 -cdrom LirioOS-kernel.iso -boot d -hda disco.img -m 256 -vga std -display none -monitor stdio -no-reboot
          mkdir -p ../capturas
          convert /tmp/arranque.ppm ../capturas/arranque.png
          convert /tmp/ayuda.ppm ../capturas/ayuda.png
          convert /tmp/raton.ppm ../capturas/raton.png
          convert /tmp/comandos.ppm ../capturas/comandos.png
          convert /tmp/dock.ppm ../capturas/dock.png
          convert /tmp/explorador.ppm ../capturas/explorador.png
          convert /tmp/visor.ppm ../capturas/visor.png
          convert /tmp/galeria.ppm ../capturas/galeria.png
          convert /tmp/imagen.ppm ../capturas/imagen.png
          convert /tmp/imagen2.ppm ../capturas/imagen2.png
          convert /tmp/editor.ppm ../capturas/editor.png
          convert /tmp/guardado.ppm ../capturas/guardado.png
          convert /tmp/disco.ppm ../capturas/disco.png
          convert /tmp/disco_gui.ppm ../capturas/disco_gui.png

      - name: Comprobar el disco con las herramientas de Linux
        working-directory: kernel
        run: |
          echo "--- fsck.vfat ---"
          fsck.vfat -n disco.img
          echo "--- contenido ---"
          mdir -i disco.img ::
          echo "--- archivo creado desde LirioOS ---"
          mtype -i disco.img ::NUEVO.TXT | tee /tmp/nuevo.txt
          grep -q "disco ok" /tmp/nuevo.txt
          python3 ../tools/check_fat32.py disco.img -t

      - name: Formatear un disco en blanco desde LirioOS
        working-directory: kernel
        run: |
          truncate -s 64M blanco.img
          (
            sleep 12
            for k in d i s c o ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 1
            for k in f o r m a t e a r spc s i ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 8
            for k in d i s c o ret; do echo "sendkey $k"; sleep 0.3; done
            for k in c d spc d i s c o ret; do echo "sendkey $k"; sleep 0.3; done
            for k in e c h o spc h o l a ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 1
            echo "screendump /tmp/formato.ppm"
            sleep 1
            echo "quit"
          ) | qemu-system-i386 -cdrom LirioOS-kernel.iso -boot d -hda blanco.img -m 256 -vga std -display none -monitor stdio -no-reboot
          convert /tmp/formato.ppm ../capturas/formato.png
          echo "--- fsck.vfat sobre el disco formateado por LirioOS ---"
          fsck.vfat -n blanco.img
          python3 ../tools/check_fat32.py blanco.img -t

      - name: Ejecutar programas en modo usuario
        working-directory: kernel
        run: |
          make -C ../user
          truncate -s 64M progs.img
          mkfs.vfat -F 32 -s 1 -n PROGS progs.img
          mcopy -i progs.img ../user/hola.elf ::HOLA.ELF
          mcopy -i progs.img ../user/falla.elf ::FALLA.ELF
          echo "esto no es un programa" > malo.txt
          mcopy -i progs.img malo.txt ::MALO.ELF
          (
            sleep 12
            for k in p r o g r a m a s ret; do echo "sendkey $k"; sleep 0.3; done
            for k in e j e c u t a r spc h o l a ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 4
            for k in e j e c u t a r spc f a l l a ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 2
            echo "screendump /tmp/procesos.ppm"
            sleep 1
            for k in l i m p i a r ret; do echo "sendkey $k"; sleep 0.3; done
            for k in e j e c u t a r spc d i s c o shift-7 h o l a dot e l f ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 4
            for k in e j e c u t a r spc d i s c o shift-7 m a l o dot e l f ret; do echo "sendkey $k"; sleep 0.3; done
            for k in e j e c u t a r spc d i s c o shift-7 f a l l a dot e l f ret; do echo "sendkey $k"; sleep 0.3; done
            for k in e j e c u t a r spc n a d a ret; do echo "sendkey $k"; sleep 0.3; done
            for k in e j e c u t a r spc h o l a ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 4
            echo "screendump /tmp/procesos2.ppm"
            sleep 1
            for k in l i m p i a r ret; do echo "sendkey $k"; sleep 0.3; done
            for k in e j e c u t a r spc n o t a s ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 2
            for k in h o l a spc m u n d o ret; do echo "sendkey $k"; sleep 0.4; done
            sleep 3
            echo "screendump /tmp/procesos3.ppm"
            sleep 1
            echo "quit"
          ) | qemu-system-i386 -cdrom LirioOS-kernel.iso -boot d -hda progs.img -m 256 -vga std -display none -monitor stdio -no-reboot
          convert /tmp/procesos.ppm ../capturas/procesos.png
          convert /tmp/procesos2.ppm ../capturas/procesos2.png
          convert /tmp/procesos3.ppm ../capturas/procesos3.png
          fsck.vfat -n progs.img
          mtype -i progs.img ::NOTAS.TXT | tee /tmp/notas.txt
          grep -q "hola mundo" /tmp/notas.txt
          python3 ../tools/check_fat32.py progs.img

      - name: Probar la multitarea (varios programas a la vez)
        working-directory: kernel
        run: |
          (
            sleep 12
            for k in e j e c u t a r spc b u c l e ret; do echo "sendkey $k"; sleep 0.3; done
            for k in e j e c u t a r spc c o n t a r ret; do echo "sendkey $k"; sleep 0.3; done
            for k in e j e c u t a r spc c o n t a r ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 1
            for k in p s ret; do echo "sendkey $k"; sleep 0.3; done
            echo "screendump /tmp/multi1.ppm"
            # el escritorio sigue respondiendo aunque 'bucle' no pare: se mueve el ratón y se teclea
            for i in 1 2 3 4 5; do echo "mouse_move 40 30"; sleep 0.3; done
            for k in e c h o spc v i v o ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 5
            echo "screendump /tmp/multi2.ppm"
            sleep 2
            echo "sendkey ret"; sleep 0.5
            for k in m a t a r spc 1 ret; do echo "sendkey $k"; sleep 0.5; done
            sleep 2
            for k in p s ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 1
            echo "screendump /tmp/multi3.ppm"
            echo "quit"
          ) | qemu-system-i386 -cdrom LirioOS-kernel.iso -boot d -m 256 -vga std -display none -monitor stdio -no-reboot
          convert /tmp/multi1.ppm ../capturas/multi1.png
          convert /tmp/multi2.ppm ../capturas/multi2.png
          convert /tmp/multi3.ppm ../capturas/multi3.png

      - name: Probar las ventanas gráficas de los programas
        working-directory: kernel
        run: |
          (
            sleep 12
            for k in e j e c u t a r spc r e l o j ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 2
            # clic en el terminal (queda debajo del reloj) para volver a escribir en él
            echo "mouse_button 1"; sleep 0.3; echo "mouse_button 0"; sleep 0.5
            for k in e j e c u t a r spc p i n t a r ret; do echo "sendkey $k"; sleep 0.3; done
            sleep 2
            # el ratón se lleva sobre la ventana de pintar y se dibuja una línea arrastrando
            for i in 1 2 3 4 5; do echo "mouse_move -50 -37"; sleep 0.3; done
            sleep 0.5
            echo "mouse_button 1"; sleep 0.3
            for i in 1 2 3 4 5 6 7 8; do echo "mouse_move 14 9"; sleep 0.25; done
            echo "mouse_button 0"; sleep 0.5
            echo "sendkey 4"; sleep 0.5
            echo "mouse_move -60 10"; sleep 0.3
            echo "mouse_button 1"; sleep 0.3
            for i in 1 2 3 4 5 6 7 8; do echo "mouse_move 14 -6"; sleep 0.25; done
            echo "mouse_button 0"; sleep 1
            echo "screendump /tmp/ventanas.ppm"
            sleep 1
            echo "sendkey esc"; sleep 2
            echo "screendump /tmp/ventanas2.ppm"
            echo "quit"
          ) | qemu-system-i386 -cdrom LirioOS-kernel.iso -boot d -m 256 -vga std -display none -monitor stdio -no-reboot
          convert /tmp/ventanas.ppm ../capturas/ventanas.png
          convert /tmp/ventanas2.ppm ../capturas/ventanas2.png

      - name: Guardar las capturas en el repositorio
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add capturas/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Capturas del arranque real [skip ci]"
            git pull --rebase
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: LirioOS-kernel-iso
          path: kernel/LirioOS-kernel.iso
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: LirioOS-kernel-capturas
          path: capturas/*.png
          if-no-files-found: error

      - name: Publicar el lanzamiento con la ISO
        if: startsWith(github.ref, 'refs/tags/kernel-v') || (github.event_name == 'workflow_dispatch' && inputs.publicar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('kernel-v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          name: "LirioOS kernel ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', inputs.version) }}"
          files: |
            kernel/LirioOS-kernel.iso
            capturas/raton.png
            capturas/galeria.png
            capturas/editor.png
          body: |
            ## LirioOS (kernel propio)

            ISO arrancable con el **kernel propio de LirioOS**, escrito desde cero en C. No es Linux ni usa nada de Windows.

            - Escritorio gráfico morado (1024x768), dock y terminal en ventana.
            - Teclado en español (ñ, tildes, AltGr).
            - Ratón, ventanas arrastrables, dock con clic y explorador de archivos gráfico.
            - Galería de imágenes: abre Archivos > imagenes, con miniaturas y botones Anterior / Siguiente.
            - Interrupciones: temporizador (100 Hz), teclado y ratón; doble clic en Archivos, cursor del editor parpadeante y comando `uptime`.
            - Disco duro ATA y FAT32: carpeta `disco` en Archivos y en el terminal, comandos `disco`, `formatear si`, `mkdir` y `rm`.
            - Gestión de memoria (mapa de GRUB, páginas y montón del kernel) y comando `mem`.
            - Editor de texto: en Archivos, **Editar** un .txt o **Nuevo** para crear uno, y **Guardar** (hasta 4000 bytes por archivo, en memoria hasta que haya disco).
            - Sistema de archivos en memoria. Comandos: `ayuda`, `ls`, `cd`, `cat`, `echo`, `date`, `limpiar`, `about`, `reiniciar`, `apagar`.

            **Cómo probarla en VirtualBox:** máquina nueva, tipo *Other*, versión *Other/Unknown*, sin disco duro, y pon `LirioOS-kernel.iso` en la unidad óptica. Si no ves el escritorio, activa **EFI desactivado** (modo BIOS clásico).

            Versión de desarrollo (kernel 0.11).
